name: Build WandryHP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12
      - name: Compilar
        run: |
          set -o pipefail
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          gradle build --stacktrace 2>&1 | tee /tmp/build.log
      - name: Resumo do erro
        if: failure()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -v '^$' /tmp/build.log | tail -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: wandryhp-jar
          path: |
            **/build/libs/wandryhp-*.jar
            !**/*-sources.jar
